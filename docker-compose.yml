
networks:
  parth-net:
    name: parth-net
    driver: bridge

services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: parth-osrm
    restart: unless-stopped
    ports:
      - "9001:5000"
    volumes:
      - ./osrm-data:/data:ro
    command: osrm-routed --algorithm mld /data/karnataka-latest.osrm
    networks:
      - parth-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parth-backend
    restart: unless-stopped
    ports:
      - "9002:8080"
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    networks:
      - parth-net
    depends_on:
      - osrm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parth-frontend
    restart: unless-stopped
    ports:
      - "9003:5173"
    environment:
      - VITE_API_URL=/api
    networks:
      - parth-net
    depends_on:
      - backend