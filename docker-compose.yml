version: '3.8'

networks:
  parth-net:
    name: parth-net
    driver: bridge

services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: parth-osrm
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./osrm-data:/data:ro
    command: osrm-routed --algorithm mld /data/karnataka-latest.osrm
    networks:
      - parth-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parth-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    networks:
      - parth-net
    depends_on:
      - osrm
